<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="color-scheme" content="dark"><title>SIPA-CARTE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:#04170f;color:#f5e6b3;font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 30%,var(--c1),var(--c2) 75%);z-index:5;overflow:auto;text-align:center}
.scr.on{display:flex}
h1{font-size:42px;margin:0;letter-spacing:3px;color:#ffd35c;text-shadow:0 3px 0 #7a5400,0 0 25px #ffd35c66}
h2{margin:0;color:#ffd35c}
.sub{opacity:.8;font-size:14px;margin-bottom:10px}
.btn{width:min(300px,100%);padding:15px;border-radius:14px;border:2px solid #d9a521;background:linear-gradient(#1c7a4a,#0d4a2b);color:#ffe9a8;font:700 18px Georgia,serif;letter-spacing:1px;box-shadow:0 4px 10px #000a}
.btn:active{transform:scale(.97)}
.seg{display:flex;gap:6px;width:min(320px,100%)}.seg .btn{padding:10px 0;font-size:14px;flex:1;width:auto}

input[type=text]{width:min(300px,100%);padding:12px;font:18px Georgia;border-radius:10px;border:2px solid #d9a521;background:#0a3320;color:#ffe9a8;text-align:center}
.av{font-size:34px;padding:6px 10px;border-radius:12px;border:2px solid transparent;background:#0a3320}.av.s{border-color:#ffd35c}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lab{display:flex;justify-content:space-between;width:min(300px,100%);font-size:15px;align-items:center;gap:10px}
.txt{max-width:340px;text-align:left;font-size:15px;line-height:1.45}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;display:none}
#top{position:absolute;top:0;left:0;right:0;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#000c,#0000);text-align:center}
#info{font-size:13px;opacity:.9;margin-bottom:4px}
#chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{padding:3px 9px;border-radius:16px;border:2px solid;background:#0a2a1bcc;font-size:14px}
.chip.cur{background:#d9a521;color:#1a1200;box-shadow:0 0 12px #ffd35c}
#msg{position:absolute;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));text-align:center;font-size:16px;font-weight:700;color:#fff3c4;text-shadow:0 2px 4px #000}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));pointer-events:auto}
#bar .btn{width:auto;flex:1;padding:10px 4px;font-size:15px}
#hist{align-items:stretch;justify-content:flex-start}
#hl{text-align:left;font-size:15px;line-height:1.6;overflow:auto;flex:1}
:root{--c1:#0f5a36;--c2:#04170f;--iw:560px}
.btn.s{box-shadow:0 0 0 3px #fff,0 0 16px #ffd35c;transform:scale(1.04)}
.btn.b2{background:linear-gradient(#2f7ae0,#173f85);border-color:#9cc4ff;color:#fff}
.btn.b3{background:linear-gradient(#e0402f,#85170f);border-color:#ffab9c;color:#fff}
.btn.b4{background:linear-gradient(#9a45d6,#4c1f85);border-color:#d9a8ff;color:#fff}
.btn.b5{background:linear-gradient(#f0a020,#a85a00);border-color:#ffe0a0;color:#fff}
.btn.b6{background:linear-gradient(#1fb5a5,#0b5f63);border-color:#9ff5ea;color:#fff}
.seg{flex-wrap:wrap}.seg .btn{min-width:28%}
input:not([type=range]),select{width:min(300px,100%);padding:11px;font:17px Georgia;border-radius:10px;border:2px solid #d9a521;background:#0a3320;color:#ffe9a8;text-align:center}
.bg{padding:0;gap:0;justify-content:center;background:#050505;overflow:hidden}

begin:["Commencez","Start"],trules:["<b>Le Tournoi</b> se joue obligatoirement à <b>4 joueurs</b>, en plusieurs manches. Chaque manche rapporte des points (comme au jeu rapide) et les points repartent à zéro à chaque phase.<br><br><b>1️⃣ Phase 1 — 4 joueurs.</b> Le premier joueur qui atteint <b>6 points</b> est qualifié automatiquement pour la finale. <i>Exception :</i> si un joueur atteint <b>3 points</b> alors que les 3 autres sont tous à <b>0</b>, il est qualifié directement. Le joueur qualifié observe, et le jeu continue entre les 3 autres.<br><br><b>2️⃣ Phase 2 — 3 joueurs.</b> Le premier qui atteint <b>4 points</b> se qualifie aussi pour la finale. <i>Exception :</i> si un joueur atteint <b>2 points</b> alors que les 2 autres sont à <b>0</b>, il est qualifié directement. Le jeu continue entre les 2 joueurs restants.<br><br><b>3️⃣ Phase 3 — 2 joueurs.</b> Le joueur qui gagne une manche est déclaré <b>3ᵉ du tournoi</b>. L'autre est éliminé.<br><br><b>4️⃣ Finale.</b> Les 2 joueurs qualifiés s'affrontent : le premier qui atteint <b>2 points</b> est déclaré <b>champion du tournoi</b>, l'autre est 2ᵉ.<br><br><b>5️⃣ Podium.</b> Les 3 finalistes sont présentés : 2ᵉ à gauche, 1er au centre, 3ᵉ à droite, avec applaudissements.","<b>The Tournament</b> is always played with <b>4 players</b>, over several rounds. Each round scores points (as in the quick game) and points reset to zero at each phase.<br><br><b>1️⃣ Phase 1 — 4 players.</b> The first player to reach <b>6 points</b> automatically qualifies for the final. <i>Exception:</i> if a player reaches <b>3 points</b> while the other 3 are all at <b>0</b>, he qualifies directly. The qualified player watches, and the game goes on between the other 3.<br><br><b>2️⃣ Phase 2 — 3 players.</b> The first to reach <b>4 points</b> also qualifies for the final. <i>Exception:</i> if a player reaches <b>2 points</b> while the other 2 are at <b>0</b>, he qualifies directly. The game goes on between the 2 remaining players.<br><br><b>3️⃣ Phase 3 — 2 players.</b> The player who wins a round is declared <b>3rd of the tournament</b>. The other is eliminated.<br><br><b>4️⃣ Final.</b> The 2 qualified players face each other: the first to reach <b>2 points</b> is the <b>tournament champion</b>, the other is 2nd.<br><br><b>5️⃣ Podium.</b> The 3 finalists are presented: 2nd left, 1st center, 3rd right, with applause."],

rtxt:["<b>But.</b> Cumuler le plus de points sur les manches choisies.<br><b>Cartes.</b> 28 cartes (7, 8, 9, 10, V, D, R en ♠ ♥ ♦ ♣). Ordre : R &gt; D &gt; V &gt; 10 &gt; 9 &gt; 8 &gt; 7. Pas d'atout.<br><b>Distribution.</b> 5 cartes chacun (3 puis 2). On distribue et on joue vers la droite (sens inverse des aiguilles d'une montre). Le joueur situé à droite du donneur ouvre la première levée.<br><b>Levées.</b> 5 levées par manche. On doit fournir la couleur demandée ; sinon on défausse une carte <b>cachée</b> qui ne gagne jamais. La plus forte carte de la couleur demandée gagne et ouvre la levée suivante.<br><b>Points.</b> Le gagnant de la 5e levée marque +1. Gagnée avec un <b>pique</b> : la voix dit « SIPA ». Gagnée avec un <b>7</b> (toute couleur) : +2 et la voix dit « Seven ». Si ce joueur avait aussi joué un 7 à la 4e levée : +4 (FOPRRRR).<br><b>Trois sept.</b> Un joueur qui reçoit au moins trois 7 gagne +1 point et la partie s'arrête (« Trois sept »).<br><b>Sans dix.</b> Une main sans 10, V, D ni R donne +1 point et arrête la partie (« Sans dix »).<br><b>Jeu rapide.</b> Nombre de joueurs, de manches (max 4), difficulté, vitesse et dos des cartes se règlent uniquement dans Paramètres.<br><b>Tournoi.</b> 4 joueurs obligatoires : qualification à 6 points, puis à 4 points, manche de la 3e place, finale à 2 points, podium (détails en appuyant sur « Tournoi »).<br><b>Multijoueur.</b> Match public (2 joueurs à proximité, recherche 1 minute), Challenge (code à 6 chiffres à partager) et Accepter un défi (saisir le code). Quitter une partie multijoueur = défaite.",
"<b>Goal.</b> Score the most points over the chosen rounds.<br><b>Cards.</b> 28 cards (7, 8, 9, 10, J, Q, K in ♠ ♥ ♦ ♣). Order: K &gt; Q &gt; J &gt; 10 &gt; 9 &gt; 8 &gt; 7. No trump.<br><b>Deal.</b> 5 cards each (3 then 2). Dealing and play go to the right (counter-clockwise). The player to the dealer's right leads the first trick.<br><b>Tricks.</b> 5 tricks per round. You must follow the led suit; otherwise discard a <b>hidden</b> card that never wins. The highest card of the led suit wins and leads the next trick.<br><b>Points.</b> The winner of the 5th trick scores +1. Won with a <b>spade</b>: the voice says “SIPA”. Won with a <b>7</b> (any suit): +2 and the voice says “Seven”. If that player also played a 7 in the 4th trick: +4 (FOPRRRR).<br><b>Three sevens.</b> A player dealt at least three 7s wins +1 point and the game stops (“Trois sept”).<br><b>No tens.</b> A hand without 10, J, Q or K gives +1 point and stops the game (“Sans dix”).<br><b>Quick game.</b> Players, rounds (max 4), difficulty, speed and card back are set only in Settings.<br><b>Tournament.</b> 4 players required: qualify at 6 points, then 4 points, 3rd-place round, final at 2 points, podium (details when you press “Tournament”).<br><b>Multiplayer.</b> Public match (2 nearby players, 1-minute search), Challenge (share a 6-digit code) and Accept a challenge (enter the code). Leaving a multiplayer game = defeat."]};
